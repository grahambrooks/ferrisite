[package]
name = "ferrisite"
version = "2026.10.0"
edition = "2024"
rust-version = "1.90"
description = "A pure-Rust static site generator for technical blogs, built on mmd, puml, adoc and forge"
license = "MIT"
repository = "https://github.com/grahambrooks/ferrisite"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.56", default-features = false }
minijinja = { version = "3.0.5", features = ["loop_controls", "serde"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
thiserror = "2"
toml = "1"

# Graham's diagram and markup tools, pinned to release tags (DESIGN.md section 7).
mmd = { git = "https://github.com/grahambrooks/mmd", tag = "v2026.10.25" }
puml = { git = "https://github.com/grahambrooks/puml", tag = "v2026.10.31" }
forge-dsl = { git = "https://github.com/grahambrooks/forge", tag = "v2026.10.25", default-features = false }
diagram-scene = { git = "https://github.com/grahambrooks/diagram-scene", tag = "v2026.10.25" }
adoc = { git = "https://github.com/grahambrooks/adoc", tag = "v2026.11.1" }
camino = "1"
# Pure-Rust regex engine (fancy-regex); the default onig engine is C.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
resvg = "0.49"
typst-assets = { version = "0.15.1", features = ["fonts"] }
ttf-parser = "0.25"

[dev-dependencies]
tempfile = "3.27.0"

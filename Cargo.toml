[package]
name = "ferrisite"
version = "2026.10.0"
edition = "2024"
rust-version = "1.90"
description = "A pure-Rust static site generator for technical blogs, built on mmd, puml, adoc and forge"
license = "MIT"
repository = "https://github.com/grahambrooks/ferrisite"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.56", default-features = false }
minijinja = { version = "3.0.5", features = ["loop_controls", "serde"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
thiserror = "2"
toml = "1"

[dev-dependencies]
tempfile = "3.27.0"

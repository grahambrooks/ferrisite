{% extends "base.html" %}
{% block title %}{{ page.title }} | {{ site.title }}{% endblock %}
{% block main %}
<article>
<h1>{{ page.title }}</h1>
{% if page.date %}<p><time datetime="{{ page.date | date('%Y-%m-%d') }}">{{ page.date | date('%-d %B %Y') }}</time> · {{ page.reading_time }} min read</p>{% endif %}
{{ page.content }}
</article>
{% endblock %}
